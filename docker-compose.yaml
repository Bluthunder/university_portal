version: '3.8'

services:
  postgresdb:
    image: "postgres"
    container_name: wildflower
    volumes:
      - D:\Bluthunder\postgres-data:/var/lib/postgresql/data

    environment:
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: student_db
      POSTGRES_USER: postgres

    ports:
      - "5432:5432"

  backend:
    image: uni-backend
    depends_on:
      - postgresdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass123
      - SPRING_DATASOURCE_URL=jdbc:postgresql://service-postgres-db:5432/student_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=pass123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect

    ports:
      - "9090:9090"

